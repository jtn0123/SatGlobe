sonar.organization=jtn0123ismysonar
sonar.projectKey=jtn0123_SatGlobe
sonar.projectName=SatGlobe
sonar.scm.provider=git
sonar.sourceEncoding=UTF-8

# Keep analysis on the shipped product source. The vendored OOTK workflow files
# are retained upstream provenance and are not executed by this repository.
sonar.sources=src
sonar.exclusions=src/lib/external/**,src/engine/ootk/.github/**

# Vitest writes this report before the cloud scanner runs in the same CI job.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Story manifests are declarative content whose repeated beat/fact/source
# scaffolding is intentional and should not count as copy-paste duplication.
sonar.cpd.exclusions=src/satglobe/stories/**
