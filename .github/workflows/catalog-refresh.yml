---
name: Catalog refresh

# Keeps the bundled catalog snapshot (public/tle/tle.json + tle/satglobe/*)
# fresh. Updates stay explicit: the job only proposes a pull request, and the
# refresh script's own validation gates (epoch regressions, object-count drops,
# SOCRATES provenance) must pass before anything is committed.
"on":
  schedule:
    # Weekly, Monday 07:17 UTC (off the hour to spread provider load).
    - cron: '17 7 * * 1'
  workflow_dispatch:

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  REFRESH_BRANCH: automation/catalog-refresh

jobs:
  refresh:
    name: Refresh catalog snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # To approve or dispatch the refresh PR's required checks (see below).
      actions: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Scoped LFS pull: see build-pipeline.yml for why this is not lfs:true.
      - name: Fetch LFS catalog snapshot
        run: git lfs pull --include="public/tle/tle.json"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The vitest config resolves src/locales/keys, which is generated.
      - name: Generate translation types
        run: npm run generate-t7e

      - name: Refresh catalog
        run: npm run catalog:refresh

      - name: Run catalog refresh tests
        # Locally installed binary, not npx (sonar githubactions:S6505/S8543).
        run: ./node_modules/.bin/vitest run scripts/satglobe/catalog-refresh.test.ts scripts/satglobe/socrates-refresh.test.ts

      - name: Open or update refresh pull request
        id: propose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every refresh rewrites timestamps and delta counts, so compare the
          # data itself: catalog bytes and the SOCRATES snapshot.
          manifest=public/tle/satglobe/manifest.json
          if git diff --quiet -- public/tle/satglobe/catalog.sha256 &&
            [ "$(git show "HEAD:$manifest" | jq -r .conjunctions.snapshotId)" = "$(jq -r .conjunctions.snapshotId "$manifest")" ]; then
            echo "Catalog and conjunction data unchanged; nothing to propose."
            exit 0
          fi
          snapshot="$(jq -r .snapshotId public/tle/satglobe/manifest.json)"
          epoch="$(jq -r .newestElementEpoch public/tle/satglobe/manifest.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$REFRESH_BRANCH"
          git add public/tle/tle.json public/tle/satglobe
          git commit -m "data(catalog): refresh bundled snapshot to ${epoch%%T*} elements" \
            -m "Snapshot ${snapshot}, generated by the scheduled catalog-refresh workflow."
          git push --force origin "$REFRESH_BRANCH"

          {
            echo "Automated \`npm run catalog:refresh\` from the scheduled workflow."
            echo
            echo '```json'
            cat public/tle/satglobe/summary.json
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"
          if [ -z "$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$REFRESH_BRANCH" \
              --title "data(catalog): refresh bundled snapshot to ${epoch%%T*} elements" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr edit "$REFRESH_BRANCH" \
              --title "data(catalog): refresh bundled snapshot to ${epoch%%T*} elements" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi

          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The PR's pull_request runs are held as action_required while
      # github-actions[bot] counts as a first-time contributor, and held
      # suites block the merge even when dispatched checks are green.
      # Approve them; if none appear (GITHUB_TOKEN PRs may not trigger
      # workflows at all), dispatch the required workflows instead.
      - name: Start required checks for the refresh pull request
        if: steps.propose.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.propose.outputs.head_sha }}
        run: |
          runs=''
          for _ in $(seq 1 12); do
            sleep 10
            runs="$(gh run list --branch "$REFRESH_BRANCH" --event pull_request --commit "$HEAD_SHA" \
              --json databaseId,conclusion --jq '.[] | "\(.databaseId) \(.conclusion)"')"
            [ -n "$runs" ] && break
          done
          if [ -z "$runs" ]; then
            echo "No pull_request runs were triggered; dispatching required workflows."
            gh workflow run build-pipeline.yml --ref "$REFRESH_BRANCH"
            gh workflow run secret-scan.yml --ref "$REFRESH_BRANCH"
            exit 0
          fi
          echo "$runs" | while read -r id conclusion; do
            if [ "$conclusion" = action_required ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" \
                || echo "::warning::Could not approve run $id; approve it from the PR's Checks tab."
            fi
          done
