name: Secret Scan
on:
  push:
    branches: [ main ]
  pull_request:
  # Dispatched by catalog-refresh.yml: its bot-opened PRs do not trigger
  # pull_request workflows, but this check is required for merging.
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
permissions:
  contents: read
jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
